name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - production-aws-staging-foundation

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: local
      USE_RERANKER: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python modules
        run: |
          python -m py_compile \
            agentic_rag/*.py \
            dashboard/*.py \
            api/*.py

      - name: Import FastAPI app
        run: python -c "from api.app import app; print(app.title)"

      - name: Validate dashboard JSON
        run: python -m json.tool monitoring/grafana/dashboards/agentic_rag_dashboard.json >/dev/null

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t agentic-rag:${{ github.sha }} .
