global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/prometheus_rules.yml

scrape_configs:
  - job_name: 'agentic_rag'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'agentic_rag'
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
